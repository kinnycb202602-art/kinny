        var raw = kv.slice(eq + 1).trim();
        // Numbers stay numbers (current/finished); anything else keeps its text
        // — the old version parseInt'd everything, which silently dropped
        // placement=whatnext.
        p[k] = /^-?\d+$/.test(raw) ? parseInt(raw, 10) : raw;
      });
      var current = p.current  || 0;                 // current_session (highest unlocked)
      var fin     = p.finished || 0;                 // largest_finished_session

      for (var n = fin + 1; n <= current; n++) {

      }

      }
      var newGroup = gNew.length ? { header: '🚀 開始新進度：', items: gNew } : null;
      var oldGroup = gOld.length ? { header: '🎒 溫習舊內容：', items: gOld } : null;

        var endVal   = (p.endvalue !== undefined) ? p.endvalue : MENU_END_VALUE;

                              'font-family:sans-serif;font-size:13px;color:#93a29b;';

    var _menuKey = '';

    // A marker only describes the CURRENT step. After a reload the whole
    // transcript is replayed, so an ancient marker would resurrect its widget —
    // observed live: a sessionmenu marker sitting at row 2 of 46 redrew the
    // session picker on top of a lesson already in progress, and locked the
    // composer with 請點擊上面選項. `_menuAnswered` cannot help: it lives in
    // memory and is empty after a refresh.
    //
    // Rule: only render a marker's widget if that marker is among the last few
    // bot messages. Unknown (marker not in the DOM) → allow, so the live
    // message-event path is unaffected.
    function markerIsCurrent(prefix, maxBack) {
      var s = bpShadowRoot();
      if (!s) return true;
      var rows = s.querySelectorAll('.bpMessageContainer[data-direction="incoming"]');
      if (!rows.length) return true;
      var re = new RegExp(prefix, 'i');
      for (var i = rows.length - 1; i >= 0; i--) {
        if (re.test(rows[i].textContent || '')) {
          var back = rows.length - 1 - i;
          if (back > (maxBack == null ? 3 : maxBack)) {
            console.log('[VideoTrack] stale marker ignored:', prefix, '(' + back + ' messages back)');
            return false;
          }
          return true;
        }
      }
      return true;
    }

    function showSessionMenu(groups, key) {
      if (!groups || !groups.length) return;
      key = key || '';

      // and the observer re-fires), but once the user taps a session it stays
      // hidden — the click handler records the key in _menuAnswered.
      if (key && _menuAnswered[key]) return;

    }

    // =========================================================
    // READ-ALOUD (TTS) — Web Speech API, Cantonese
    // =========================================================
    // Zero-cost, fully client-side. No API key, no network call, no
    // Botpress change. Speaks each NEW bot message when the user has
    // switched the toggle on.
    //
    // Device reality (why the button can hide itself):
    //   • iOS / iPadOS / macOS Safari → built-in zh-HK voice (Sinji). Works.
    //   • Edge on Windows            → zh-HK natural voices. Best quality.
    //   • Android Chrome             → Cantonese is a SEPARATE Google TTS
    //     voice pack that is usually NOT installed. Without it the device
    //     falls back to Mandarin, which reads Cantonese text in Putonghua.
    //     Install it via Settings → Accessibility → Text-to-speech output →
    //     Google TTS → Install voice data → Cantonese (Hong Kong).

    // nonsense. `__vtTTS.voices()` in the console lists what the device offers.
    // ---------------------------------------------------------
    // CONTROL: there is no custom button. Botpress's own speaker (mute/unmute)
    // icon in the header is the single switch — unmuted means read-aloud is on.
    // One control keeps it simple for elderly users, and leaves the
    // new-conversation button unobstructed.
    var TTS_RATE         = 0.85;          // slower than default — elderly listeners
    var TTS_PITCH        = 1.0;
    var TTS_LANG         = 'zh-HK';

    var _ttsSupported = !!(_synth && typeof window.SpeechSynthesisUtterance === 'function');
    var _ttsOn        = false;
    var _ttsArmed     = false;   // false until the initial history replay is past
    var _ttsPrimed    = false;   // iOS needs one utterance inside a real user gesture
    var _ttsSpoke     = false;   // an utterance has actually STARTED — engine proven live
    var _ttsVoice     = null;
    var _ttsVoiceIsCanto = false;
    var _ttsMsgQueue  = [];      // whole messages waiting their turn (FIFO)
    var _ttsQueue     = [];      // chunks of the message being spoken right now
    var _ttsBusy      = false;   // a message is mid-read
    var _ttsCurrent   = '';      // full text of the message being read (for re-queue)
    var _ttsSeen      = {};      // message id → true (dedupe; Botpress can re-emit)
    var _ttsOutCount  = -1;      // number of outgoing (user) rows last seen in the DOM
    var _ttsKeepAlive = null;
    var _ttsWatch     = null;    // watchdog interval for engines that skip onend
    var _ttsIdleTicks = 0;

    // ── Voice selection ──────────────────────────────────────
    // Ranked: true Cantonese → any Chinese-HK/Taiwan → any Chinese at all.
    // Anything below真 Cantonese is flagged so the console says so.
    function ttsPickVoice() {
      var vs = [];
      try { vs = _synth.getVoices() || []; } catch (e) { return null; }
      if (!vs.length) return null;
      function lang(v) { return String(v.lang || '').toLowerCase().replace(/_/g, '-'); }
      function name(v) { return String(v.name || ''); }
      function find(fn) { for (var i = 0; i < vs.length; i++) { if (fn(vs[i])) return vs[i]; } return null; }

      var v =
        find(function (x) { var l = lang(x); return l === 'zh-hk' || l.indexOf('yue') === 0; }) ||
        find(function (x) { return /cantonese|粵|粤|廣東|广东/i.test(name(x)); }) ||
        find(function (x) { var l = lang(x); return l.indexOf('zh-hk') !== -1 || l.indexOf('yue') !== -1; });

             find(function (x) { return lang(x).indexOf('zh') === 0; }) ||
             null;
    }

    function ttsResolveVoice() {
      var v = ttsPickVoice();
      if (!v) return false;
      _ttsVoice = v;
      console.log('[VideoTrack][TTS] Voice:', v.name, '(' + v.lang + ')',
                  _ttsVoiceIsCanto ? '— Cantonese ✓'
                                   : '— ⚠ NOT Cantonese; this device will read the text in Mandarin');
      return true;
    }

    // ── Strip markers / markdown / URLs before speaking ───────
    // Without this the bot reads "__userid:003__" aloud as "userid colon
    // zero zero three", and every painscale/sessionmenu marker too.
    var TTS_MARKER_PREFIXES = ['userid', 'session', 'placement', 'reviewsession',
                               'currentvideoclipno', 'painscale', 'confscale', 'sessionmenu'];

    // Built via RegExp() rather than a /…/u literal: an unsupported flag in a
    // literal is a PARSE error that would kill this whole script on old browsers.
    var _TTS_EMOJI_RE = null;
    try {
      _TTS_EMOJI_RE = new RegExp('[\\u{1F000}-\\u{1FAFF}\\u{2190}-\\u{21FF}\\u{2300}-\\u{27BF}\\u{FE0F}\\u{2B00}-\\u{2BFF}]', 'gu');

      var s = String(raw || '').trim();
      if (!s) return true;
      if (/^__[^_]+?:[\s\S]*?__$/.test(s)) return true;          // raw marker
      var lower = s.toLowerCase();
      for (var i = 0; i < TTS_MARKER_PREFIXES.length; i++) {      // Markdown-rendered marker

      return /^[^:\s]+:(singlechoice|multiplechoice)(:|$)/i.test(s);
    }

    function ttsSanitize(raw) {
      var t = String(raw || '');
      if (ttsIsMarkerText(t)) return '';
      t = t.replace(/__[^_]+?:[\s\S]*?__/g, ' ');       // markers embedded mid-text
      t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ');      // markdown images
      t = t.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');    // links → keep the label only
      t = t.replace(/https?:\/\/\S+/gi, ' ');           // bare URLs
      t = t.replace(/`+[^`]*`+/g, ' ');                 // code spans
      t = t.replace(/[*_#>~`|]/g, ' ');                 // leftover markdown punctuation
      try { t = t.replace(_TTS_EMOJI_RE, ' '); } catch (e) {}

    // ── Chunking ─────────────────────────────────────────────
    // Engines silently drop the tail of long utterances, so break on sentence
    // punctuation. Hand-rolled loop — no lookbehind regex (Safari < 16.4).
    //
    // Chinese writes long sentences with few full stops, so a whole message can
    // contain just one 。 at the very end and would otherwise go over as a
    // single oversized utterance. Commas (，、,) are therefore secondary break
    // points, and the hard cap is deliberately small — mobile engines are far
    // less forgiving about length than desktop.
    function ttsChunk(t) {
      var out = [], buf = '';
      var HARD = '。！？!?；;\n';     // sentence enders — break as soon as we have enough
      var SOFT = '，、,';             // clause breaks — only once the chunk is getting long

        var brk = (HARD.indexOf(ch) !== -1 && buf.length >= 8) ||
                  (SOFT.indexOf(ch) !== -1 && buf.length >= Math.floor(TTS_CHUNK_MAX * 0.6)) ||
                  buf.length >= TTS_CHUNK_MAX;
        if (brk) { out.push(buf.trim()); buf = ''; }
      }
      if (buf.trim()) out.push(buf.trim());
      return out.filter(function (s) { return s.length > 0; });
    }

    // ── Media arbitration ────────────────────────────────────
    // CRITICAL: when a clip starts we STOP TALKING. We never call pause() on
    // the media element to make room for speech — a programmatic pause fires a
    // real 'pause' event, which attachToVideo/attachToAudio would log as a
    // "Click Pause" row in UserInputTable and corrupt the watch-duration data.
    var _ttsMediaEls = [];

    function ttsRegisterMedia(el) {
      if (!el || _ttsMediaEls.indexOf(el) !== -1) return;
      _ttsMediaEls.push(el);
      // A clip starting is a hard stop: whatever was being read is ABANDONED,
      // not re-queued, and the pending queue is dropped too. Nothing replays
      // when the clip finishes — the user moved on.
      el.addEventListener('play', function () {
        if (_ttsBusy || _ttsMsgQueue.length) {
          console.log('[VideoTrack][TTS] clip started — read-aloud stopped (not resumed later)');
        }
        ttsStop();
      });
    }

    function ttsMediaPlaying() {
      for (var i = 0; i < _ttsMediaEls.length; i++) {
        var m = _ttsMediaEls[i];
        if (m && !m.paused && !m.ended) return true;
      }
      return false;
    }

    // ── Jump to the message being read ───────────────────────
    // When a message starts being read we JUMP straight to it — no gliding —
    // and park it just below the top of the view, leaving a gap above so the
    // previous message's edge still shows and it doesn't look jammed against
    // the top. That gap is measured from the conversation itself (the real
    // spacing between two message rows), so it matches the existing rhythm
    // instead of being an invented number.
    //
    // A message taller than the screen gets further jumps as the reading
    // advances, so the text being spoken stays on screen. Short messages —
    // the common case — get exactly one jump and then hold still.
    var TTS_SCROLL_ON = true;
    var TTS_GAP_FALLBACK = 16; // px, used only if the conversation gap can't be measured

    var _scRow  = null,   // message element being read
        _scTotal = 0,     // its length in characters
        _scDone  = 0,     // characters spoken so far
        _scLoop  = null,  // rAF id of the position keeper
        _scWant  = -1,    // the scrollTop we intend to hold (-1 = not set yet)
        _scAbort = false, // user took over scrolling — stay out of their way
        _scUserAt = 0,    // timestamp of the last genuine scroll input from the person

    // Generous, because iOS momentum keeps scrolling after the finger lifts.
    var TTS_USER_SCROLL_MS = 2000;

    // Marks input that can actually SCROLL. A plain tap (pointerdown/touchstart)
    // deliberately does not count: the user taps 「OK」, the bot answers, Botpress
    // scrolls — and mistaking that for a manual scroll would drop the hold at
    // exactly the wrong moment. Only dragging, wheeling and scroll keys count.
    // These events are composed, so they cross the webchat's shadow boundary.
    var _scInputWired = false;
    function ttsWireUserScrollDetect() {
      if (_scInputWired) return;
      _scInputWired = true;

      var opts  = { capture: true, passive: true };

    // The element that ACTUALLY scrolls the message being read. Resolved by
    // walking up from the row itself (crossing the shadow boundary) to the
    // nearest genuinely scrollable ancestor — guessing at a container instead
    // means setting scrollTop on something that doesn't scroll, which silently
    // does nothing and leaves the view wherever Botpress last put it (the end).
    var _scEl = null;

    // checks this and stands down, so a bot message arriving mid-sentence can't
    // drag the view off the message being spoken.
    // Deliberately keyed on _ttsBusy rather than _scRow: _scRow is momentarily
    // null between two queued messages, and a pin-to-bottom slipping through
    // that gap would still snatch the view away mid-read.
    // Keyed on the SESSION, not on _ttsBusy. The bot sends its messages a couple
    // of seconds apart, so a short one finishes reading before the next arrives

    // conversation (the video card, a choice widget, whatever came last).
    function ttsMaybeEndSession() {

      if (_ttsBusy || _ttsMsgQueue.length) return;                       // still reading
      if (typeof botIsIdle === 'function' && !botIsIdle()) return;       // bot still talking
      _ttsSession = false;
      _scrollHeld = false;
      ttsScrollEnd();
      console.log('[VideoTrack][TTS] burst finished — releasing to the newest message');
      // Unconditional: the tail of the burst (a video card, a choice widget)
      // often isn't a spoken message, so there may have been no suppressed pin
      // to replay — but it still needs to be brought into view.

    function ttsScrollBegin(row, totalChars) {
      ttsScrollEnd();

      _scAbort = false;
      _scWant = -1;

    }

    // ── The position keeper ──────────────────────────────────
    // Declining our OWN pin-to-bottom isn't enough: the Botpress webchat
    // scrolls its message list to the bottom by itself whenever a message
    // arrives, from inside its own bundle where we can't intercept it. So while
    // reading we hold a desired scrollTop (_scWant) and, every frame, put the
    // container back if something moved it.

    function ttsScrollLoopStart() {

            // yanking them to the end would undo the very thing they just did.

          sc.scrollTop = _scWant;                 // programmatic jump — put it back
          _scWant = sc.scrollTop;
          if (now - _scLoggedAt > 1000) {         // throttled so a fight is visible but not spammy

                        Math.round(drift) + 'px');

    // The conversation's own spacing between two message rows. Measured once
    // from the live DOM so the gap we leave matches what's already on screen.
    var _scGap = 0;

          var a = rows[i - 1].getBoundingClientRect();
          var b = rows[i].getBoundingClientRect();

          if (g > 0 && g < 120) { _scGap = Math.round(g); return _scGap; }

      return TTS_GAP_FALLBACK;   // don't cache the fallback — retry next message
    }

    // Where should scrollTop be when `frac` of the message has been read?
    // frac 0 → message top parked one conversation-gap below the view's top.
    // frac 1 → message bottom one gap above the view's base (tall messages only).
    function ttsScrollTarget(frac, sc) {
      if (!_scRow || !_scRow.getBoundingClientRect) return null;
      var rr = _scRow.getBoundingClientRect(), sr = sc.getBoundingClientRect();
      if (!rr.height) return null;
      var gap      = ttsConvGap(sc);
      var rowTop   = rr.top - sr.top + sc.scrollTop;
      var startTop = rowTop - gap;                                  // spacing above the message
      var endTop   = rowTop + rr.height - sc.clientHeight + gap;    // spacing below it
      // Fits on screen → one position, top-anchored with its gap. No creeping.
      var target   = (endTop <= startTop) ? startTop

      if (!TTS_SCROLL_ON || !_scRow || _scAbort) return;
      var sc = ttsScrollEl();
      if (!sc || !sc.getBoundingClientRect) return;
      var target = ttsScrollTarget(frac, sc);
      if (target === null) return;
      if (_scWant >= 0 && Math.abs(target - _scWant) < 2) return;   // already there
      sc.scrollTop = target;
      _scWant = sc.scrollTop;        // absorb any clamping the browser applies

      // Verify we actually landed ON the message. If the arithmetic was off —
      // wrong scroll container, an offset parent we didn't account for — the
      // row won't be near the top of the view and we'd be stuck at the end.
      // scrollIntoView knows the true geometry, so fall back to it and then
      // back off by the conversation gap for the spacing.
      if (frac === 0) {
        var rr = _scRow.getBoundingClientRect(), sr = sc.getBoundingClientRect();

                      'px from top) — using scrollIntoView');
          try { _scRow.scrollIntoView({ block: 'start', inline: 'nearest' }); } catch (e) {}
          sc.scrollTop = Math.max(0, sc.scrollTop - ttsConvGap(sc));
          _scWant = sc.scrollTop;

    // the target never changes, so this is a no-op after the first jump.
    function ttsScrollAdvance(chars) {
      if (!TTS_SCROLL_ON || !_scRow || _scAbort) return;

      ttsScrollJump(Math.min(1, _scDone / _scTotal));

    // ── Speaking ─────────────────────────────────────────────
    // Messages are QUEUED, not superseded. If the bot sends three messages in a
    // row, each is read to the end before the next begins — the reader never
    // jumps ahead. ttsStop() is the only thing that cuts a message short, and
    // it discards rather than rewinds.
    // A queue entry is { text, row } — row is the message element, used to keep
    // the scroll position in step with the reading (ttsScrollAdvance).
    function ttsSpeak(text, row) {
      if (!_ttsSupported || !_ttsOn || !text) return;
      _ttsSession = true;                   // burst starts (or continues)
      _ttsMsgQueue.push({ text: text, row: row || null });
      if (!_ttsBusy) ttsNextMessage();
    }

    function ttsNextMessage() {
      if (!_ttsMsgQueue.length) {
        // Queue drained — but the bot may just be pausing before its next
        // message. Keep holding the current position; ttsMaybeEndSession()
        // decides when the burst is genuinely over.
        _ttsBusy = false;
        ttsKeepAliveStop();
        ttsWatchStop();
        return;
      }
      _ttsBusy    = true;
      _ttsMsgDone = false;
      var item    = _ttsMsgQueue.shift();
      _ttsCurrent = item.text;
      _ttsQueue   = ttsChunk(item.text);
      ttsScrollBegin(item.row, item.text.length);
      ttsKeepAliveStart();
      // Chrome/Edge drop an utterance passed to speak() in the same tick as a
      // cancel(), and can be left in a stuck paused state. Small gap + nudge.
      setTimeout(function () {
        try { if (_synth.paused) _synth.resume(); } catch (e) {}
        ttsPump();
      }, 90);
    }

    // Hand the WHOLE message to the engine in one go — one speak() call per
    // chunk, queued back to back — instead of waiting for each chunk's `onend`
    // before submitting the next.
    //
    // Why: on Android Chrome `onend` is unreliable. It frequently never fires,
    // and chaining off it stops the read dead after the first chunk — which is
    // exactly the "reads ~30 characters then goes quiet" symptom. The engine's
    // own queue is dependable, so we let it do the sequencing and use the
    // events only for scroll timing.
    function ttsPump() {
      if (!_ttsQueue.length) { ttsMessageDone(); return; }
      var chunks = _ttsQueue.slice();
      _ttsQueue = [];
      var lastIdx = chunks.length - 1;
      var spoke = 0;

      chunks.forEach(function (chunk, i) {
        var u;
        try { u = new SpeechSynthesisUtterance(chunk); } catch (e) { return; }
        if (_ttsVoice) { u.voice = _ttsVoice; u.lang = _ttsVoice.lang; }
        else           { u.lang = TTS_LANG; }
        u.rate   = TTS_RATE;
        u.pitch  = TTS_PITCH;
        u.volume = 1;
        // Scroll follows the voice: onstart is far more reliable than onend.
        // It's also our proof that the engine is genuinely unlocked (iOS).
        u.onstart = function () {
          if (!_ttsSpoke) {
            _ttsSpoke = true;
            console.log('[VideoTrack][TTS] first utterance started — engine is live');
            setStatus('success', 'TTS speaking');
          }
          ttsScrollAdvance(chunk.length);
        };
        u.onend   = function () { if (i === lastIdx) ttsMessageDone(); };
        u.onerror = function (e) {
          // 'interrupted'/'canceled' are normal — they fire on our own cancel().
          var err = (e && e.error) || 'unknown';
          if (err !== 'interrupted' && err !== 'canceled') {
            console.warn('[VideoTrack][TTS] utterance error:', err, '| chunk:', chunk.slice(0, 24));
            setStatus('error', 'TTS error: ' + err);
          }
          if (i === lastIdx) ttsMessageDone();
        };
        try { _synth.speak(u); spoke++; }
        catch (e) { console.warn('[VideoTrack][TTS] speak failed:', e && e.message); }
      });

      if (!spoke) { ttsMessageDone(); return; }
      ttsWatchStart();
    }

    // Called once per message, whichever way it ends.
    function ttsMessageDone() {
      if (_ttsMsgDone) return;          // onend and the watchdog can both arrive
      _ttsMsgDone = true;
      ttsWatchStop();
      setTimeout(ttsNextMessage, 60);
    }

    // Safety net for engines that never deliver `onend` (Android especially).
    // If the synthesiser reports nothing speaking and nothing pending across
    // two consecutive checks, the message is over regardless of what fired.
    function ttsWatchStart() {
      ttsWatchStop();
      _ttsIdleTicks = 0;
      _ttsWatch = setInterval(function () {
        if (!_synth) return;
        if (_synth.speaking || _synth.pending) { _ttsIdleTicks = 0; return; }
        if (++_ttsIdleTicks >= 2) {
          console.log('[VideoTrack][TTS] engine went idle without onend — advancing');
          ttsMessageDone();
        }
      }, 400);
    }
    function ttsWatchStop() {
      if (_ttsWatch) { clearInterval(_ttsWatch); _ttsWatch = null; }
    }

    // Stopping always DISCARDS. Whether it was a user message or a clip that
    // interrupted, the partly-read message is gone and nothing is replayed —
    // the user has moved on and re-hearing it would be noise.
    function ttsStop() {
      _ttsCurrent  = '';
      _ttsQueue    = [];
      _ttsMsgQueue = [];
      _ttsBusy     = false;
      try { _synth && _synth.cancel(); } catch (e) {}
      ttsKeepAliveStop();
      ttsScrollEnd();
      // Stopped by a user send or a clip — the user's attention has moved, so
      // let the view jump to the bottom as it normally would.
      ttsReleaseScroll();
    }

    // DESKTOP Chrome stops synthesis after ~15s; a pause/resume nudge revives it.
    // Deliberately NOT applied on mobile: iOS stutters audibly, and on Android
    // pause()/resume() can abort the utterance outright — the very failure this
    // was meant to prevent. Neither mobile engine has the 15s bug anyway.
    function ttsKeepAliveStart() {
      if (_ttsKeepAlive || IS_IOS || IS_ANDROID) return;
      _ttsKeepAlive = setInterval(function () {
        if (!_synth) return;
        if (_synth.speaking && !_synth.paused) { try { _synth.pause(); _synth.resume(); } catch (e) {} }
      }, 9000);
    }
    function ttsKeepAliveStop() {
      if (_ttsKeepAlive) { clearInterval(_ttsKeepAlive); _ttsKeepAlive = null; }
    }

    // iOS/Safari refuse speak() unless one utterance has already run inside a
    // real user gesture. The user's first tap is that gesture.
    //
    // IMPORTANT: the priming utterance must NOT have volume 0. iOS treats a
    // muted utterance as nothing happening and stays locked — which is why
    // read-aloud was silent on iPhone/iPad while the webchat's chime worked
    // fine (that's an <audio> element, unlocked by different rules). A single
    // space at normal volume is inaudible but does unlock the engine.
    function ttsPrime() {
      if (_ttsPrimed || !_ttsSupported) return;
      _ttsPrimed = true;
      try {
        var u = new SpeechSynthesisUtterance(' ');
        u.volume = 1;
        u.rate   = 1;
        if (_ttsVoice) { u.voice = _ttsVoice; u.lang = _ttsVoice.lang; }
        _synth.speak(u);
        console.log('[VideoTrack][TTS] primed inside a user gesture');
      } catch (e) {
        _ttsPrimed = false;    // let the next gesture try again
        console.warn('[VideoTrack][TTS] priming failed:', e && e.message);
      }
    }

    // ── Driven by Botpress's own speaker (mute/unmute) button ──
    // No custom control: the header's speaker icon is the single switch, so the
    // user has one idea of "sound" and the new-conversation button stays clear.
    // Botpress persists that setting in localStorage under
    // bp-webchat-<client-id>-sound, which we poll as the source of truth.
    // If it isn't being picked up, run __vtTTS.findSound() in the console.
    function bpSoundKey() {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && /^bp-webchat-.*-sound$/i.test(k)) return k;
        }
      } catch (e) {}
      return null;
    }

    function bpSoundIsOn() {
      var k = bpSoundKey();
      if (!k) return null;
      var raw;
      try { raw = localStorage.getItem(k); } catch (e) { return null; }
      if (raw == null) return null;
      raw = String(raw).trim();
      if (/^"?(true|false)"?$/i.test(raw)) return /true/i.test(raw);
      try {
        var o = JSON.parse(raw), found = null;
        (function walk(v, depth) {
          if (found !== null || v == null || depth > 4) return;
          if (typeof v === 'object') {
            for (var kk in v) {
              if (typeof v[kk] === 'boolean' && /sound|enable|mute|on/i.test(kk)) {
                found = /mute/i.test(kk) ? !v[kk] : v[kk];
                return;
              }
            }
            for (var k2 in v) walk(v[k2], depth + 1);
          }
        })(o, 0);
        return found;
      } catch (e) { return null; }
    }

    function bpSoundBtn() {
      var sr = bpShadowRoot();
      if (!sr) return null;
      var cands = sr.querySelectorAll('button, [role="button"], [class*="ound"], [class*="olume"]');
      for (var i = 0; i < cands.length; i++) {
        var el = cands[i];
        var hay = [el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className,
                   el.getAttribute('aria-label') || '', el.getAttribute('title') || '',
                   el.getAttribute('data-testid') || ''].join(' ');
        if (/sound|volume|mute|audio|聲|音/i.test(hay)) return el;
      }
      return null;
    }

    // ── Start each session UNMUTED (read-aloud on by default) ─────────────
    // Changed 2026-08-16 (emon): read-aloud used to start muted and the
    // participant had to opt in. Elderly participants were missing it entirely,
    // so sound is now ON by default and they opt OUT with the speaker icon.
    //
    // Botpress's own speaker already defaults to unmuted, so this normally has
    // nothing to click — it exists to undo a mute that persisted in
    // localStorage from an earlier visit.
    //
    // The "already done" flag is deliberately stored under a bp-webchat- prefix:
    // the 7-day reset block at the top of this file wipes every bp-webchat-* key,
    // so this flag dies with the conversation and the NEXT session starts
    // unmuted again — while a mute during a session still sticks across reloads.
    var TTS_SOUND_FLAG   = 'bp-webchat-vt-initial-sound';
    var _ttsSoundSettled = false;  // true once the initial state is applied (or given up on)

    function ttsApplyInitialUnmute() {
      // Already handled earlier this session (e.g. a reload) — respect whatever
      // the user has since chosen.
      try {
        if (localStorage.getItem(TTS_SOUND_FLAG) === '1') { _ttsSoundSettled = true; return true; }
      } catch (e) {}
      var cur = bpSoundIsOn();
      if (cur === null) return false;                 // can't read state yet — retry
      if (cur === true) {                             // already unmuted, nothing to click
        try { localStorage.setItem(TTS_SOUND_FLAG, '1'); } catch (e) {}
        _ttsOn = true;
        _ttsSoundSettled = true;
        return true;
      }
      var btn = bpSoundBtn();
      if (!btn) return false;                         // button not rendered yet — retry
      try { btn.click(); } catch (e) { return false; }
      try { localStorage.setItem(TTS_SOUND_FLAG, '1'); } catch (e) {}
      _ttsOn = true;
      _ttsSoundSettled = true;
      console.log('[VideoTrack][TTS] unmuted for the start of this session — ' +
                  'tap the speaker in the header to silence the messages');
      return true;
    }

    // Botpress's speaker button is the MASTER switch — we only follow it.
    // Unmuted (sound on) → read-aloud on. Muted → silent, queue dropped.
    function ttsWatchSound() {
      // Until the start-of-session sound state has landed, don't follow — a
      // stale stored "muted" could otherwise stick before we clear it.
      if (!_ttsSoundSettled) return;
      var cur = bpSoundIsOn();
      if (cur === null || cur === _ttsOn) return;
      _ttsOn = cur;
      if (!_ttsOn) ttsStop();
      console.log('[VideoTrack][TTS] follows Botpress speaker →', _ttsOn ? 'ON (unmuted)' : 'OFF (muted)');
    }

    // iOS/Safari refuse speak() until one utterance has run inside a real user
    // gesture. With no button of our own to tap, we prime on the FIRST touch or
    // click anywhere — including the speaker button itself, whose click lands in
    // the shadow root. A zero-volume utterance, so nothing is audible.
    // Re-primes on EVERY tap until we have actually heard an utterance start.
    // A single attempt isn't enough on iOS: if the first tap lands before the
    // voice list is populated, or Safari declines that particular gesture, one
    // shot would leave read-aloud permanently locked with no way to recover.
    // We stop re-priming as soon as an `onstart` proves the engine is live.
    function ttsWireGesturePriming() {
      function onGesture() {
        if (_ttsSpoke) {                       // proven working — stop listening
          document.removeEventListener('pointerdown', onGesture, true);
          document.removeEventListener('touchend', onGesture, true);
          document.removeEventListener('click', onGesture, true);
          return;
        }
        _ttsPrimed = false;                    // allow another attempt
        ttsPrime();
      }
      document.addEventListener('pointerdown', onGesture, true);
      document.addEventListener('touchend', onGesture, true);
      document.addEventListener('click', onGesture, true);
    }

    // ── Entry point from onMessage ───────────────────────────
    // Logs a reason for EVERY skip. If read-aloud stays silent, the console
    // line starting "[VideoTrack][TTS] skip —" says exactly which gate closed.
    function ttsOnBotMessage(msg, rawText) {
      function skip(why, extra) {
        console.log('[VideoTrack][TTS] skip — ' + why, extra === undefined ? '' : extra);
      }
      if (!_ttsSupported) return skip('speechSynthesis not supported');

      var id = (msg && (msg.id || msg.messageId ||
                        (msg.block && msg.block.id))) || '';
      if (id) {
        if (_ttsSeen[id]) return skip('duplicate message id', id);
        _ttsSeen[id] = true;
      }
      if (!_ttsArmed) return skip('not armed yet (history replay window, ' +
                                  TTS_ARM_DELAY_MS + 'ms after ready)');
      if (!_ttsOn)    return skip('muted — unmute with the speaker button in the header');

      var clean = ttsSanitize(rawText);
      if (!clean || clean.length < 2) {
        return skip('nothing speakable after sanitising', JSON.stringify(String(rawText || '').slice(0, 80)));
      }
      console.log('[VideoTrack][TTS] speaking:', clean.slice(0, 60));
      ttsSpeak(clean);
    }

    // ── DOM-driven message pickup (the reliable path) ────────
    // The Botpress 'message' event does NOT fire dependably for bot messages
    // in this bot — the same reason processMarker() has a DOM fallback for the
    // session menu. So read-aloud watches the rendered message rows instead,
    // using the exact selector the composer lock already relies on:
    //   .bpMessageContainer[data-direction="incoming"]
    //
    // Messages stream in character by character, so a row is only spoken once
    // its text has stopped changing for TTS_SETTLE_MS — otherwise we'd read
    // half a sentence and then cut ourselves off with the rest.
    var TTS_SETTLE_MS = 600;
    var _ttsRowState  = new WeakMap();   // row element → { text, at, done }

    function ttsMessageRows() {
      var c = null;
      try { c = (typeof painScaleContainer === 'function' && painScaleContainer()) || null; } catch (e) {}
      if (!c) c = bpShadowRoot();
      if (!c || !c.querySelectorAll) return [];
      var rows = c.querySelectorAll('.bpMessageContainer[data-direction="incoming"]');
      if (rows.length) return rows;
      // Fallback if the attribute ever changes: everything that is neither the
      // user's own message nor a system row.
      //
      // "system" is the date separator ("Today"). Excluding it here is the fix
      // for read-aloud announcing "Today" at the start of a conversation
      // (2026-08-16, emon): the query above is still empty until the first bot
      // message renders, so this fallback ran, and it treated the separator as
      // a bot message because it only checked for "outgoing".
      var all = c.querySelectorAll('.bpMessageContainer'), out = [];
      for (var i = 0; i < all.length; i++) {
        var dir = all[i].getAttribute('data-direction');
        if (dir !== 'outgoing' && dir !== 'system') out.push(all[i]);
      }
      return out;
    }

    // Text of a bot row, minus anything that isn't the message itself:
    // choice-button labels are options to pick, not prose to read aloud.
    function ttsRowText(row) {
      var clone;
      try { clone = row.cloneNode(true); } catch (e) { return (row.textContent || '').trim(); }
      var junk = clone.querySelectorAll(
        '.bpMessageBlocksButton, .bpMessageBlocksDropdownButtonContainer, button, video, audio, img, svg');
      for (var i = 0; i < junk.length; i++) {
        if (junk[i].parentNode) junk[i].parentNode.removeChild(junk[i]);
      }
      return (clone.textContent || '').replace(/\s+/g, ' ').trim();
    }

    // Any new OUTGOING row means the user just answered — stop talking at once
    // and drop anything queued. Done in the DOM so it catches every send path:
    // typed text, a native choice button, the pain-scale strip and the session
    // menu all land here, whereas the 'messageSent' event does not fire for all
    // of them. Returns true if a send was just detected.
    function ttsCheckUserSend() {
      var c = null;
      try { c = (typeof painScaleContainer === 'function' && painScaleContainer()) || null; } catch (e) {}
      if (!c) c = bpShadowRoot();
      if (!c || !c.querySelectorAll) return false;
      var n = c.querySelectorAll('.bpMessageContainer[data-direction="outgoing"]').length;
      if (_ttsOutCount === -1) { _ttsOutCount = n; return false; }   // first sighting: just record
      if (n <= _ttsOutCount) { _ttsOutCount = n; return false; }
      _ttsOutCount = n;
      if (_ttsBusy || _ttsMsgQueue.length) {
        console.log('[VideoTrack][TTS] user sent a message — stopping read-aloud');
        ttsStop();
      }
      return true;
    }

    function ttsScanDom() {
      if (!_ttsSupported) return;
      ttsCheckUserSend();
      var rows = ttsMessageRows();
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var st  = _ttsRowState.get(row);
        if (st && st.done) continue;

        var txt = ttsRowText(row);
        if (!st) {                                   // first sighting — start the settle clock
          _ttsRowState.set(row, { text: txt, at: Date.now(), done: false });
          continue;
        }
        if (txt !== st.text) { st.text = txt; st.at = Date.now(); continue; }  // still streaming
        if (Date.now() - st.at < TTS_SETTLE_MS) continue;                      // not settled yet

        // A popup is up: say nothing, and do NOT mark the row done — the user
        // is being asked a question and speech over it is confusing. Leaving
        // the row undecided means it gets read normally once the popup closes,
        // instead of being silently swallowed.
        if (popupOpen()) continue;

        st.done = true;                              // decided once, never revisited
        if (!_ttsArmed) {
          // Disarmed: replayed history at boot, or the page went to the
          // background (see ttsDisarm). Mark it read, stay silent.
          if (!_ttsQuietLogged) { _ttsQuietLogged = true; console.log('[VideoTrack][TTS] disarmed — marking messages read without speaking'); }
          continue;
        }
        if (!_ttsOn)    continue;                    // muted — mark, don't read
        // NOTE: there is deliberately NO `if (document.hidden)` check here.
        // Chrome reports a fully occluded desktop window as hidden, so a
        // per-message check silenced read-aloud whenever another window sat on
        // top — and because the row is marked done, that message was lost for
        // good. Backgrounding is handled ONCE, by ttsDisarm() on the
        // visibilitychange / freeze / pageshow events, which is enough.

        // Arrived while a clip is playing: mark it read and let it go. Queuing
        // it would mean a burst of catch-up speech the moment the clip ends.
        if (ttsMediaPlaying()) {
          console.log('[VideoTrack][TTS] skip — a clip is playing:', txt.slice(0, 40));
          continue;
        }

        var clean = ttsSanitize(txt);
        if (!clean || clean.length < 2) {
          console.log('[VideoTrack][TTS] skip — nothing speakable in row:', JSON.stringify(txt.slice(0, 60)));
          continue;
        }
        console.log('[VideoTrack][TTS] ' + (_ttsBusy ? 'queued' : 'speaking') + ':', clean.slice(0, 60));
        ttsSpeak(clean, row);   // row lets the scroll follow the reading
      }
    }

    function ttsInit() {
      if (!_ttsSupported) {
        console.warn('[VideoTrack][TTS] speechSynthesis unavailable on this browser');
        return;
      }
      // getVoices() is async on Chrome — it can return [] on the first call.
      function tryResolve() { return ttsResolveVoice(); }
      if (!tryResolve()) {
        try { _synth.onvoiceschanged = function () { tryResolve(); }; } catch (e) {}
        var tries = 0;
        var iv = setInterval(function () {
          if (tryResolve() || ++tries >= 20) {
            clearInterval(iv);
            if (!_ttsVoice) {
              console.warn('[VideoTrack][TTS] No Chinese voice on this device — read-aloud stays ' +
                           'silent. On Android install: Settings → Accessibility → ' +
                           'Text-to-speech output → Google TTS → Install voice data → Cantonese (Hong Kong).');
            }
          }
        }, 400);
      }

      ttsWireUserScrollDetect();

      // and Botpress's stored sound state both appear a moment after 'ready'.

        if (ttsApplyInitialUnmute() || ++soundTries >= 25) {
          clearInterval(soundIv);

            // Couldn't find the button or read the state — unblock the follower
            // so the speaker button still works, just without the initial unmute.
            _ttsSoundSettled = true;
            console.warn('[VideoTrack][TTS] could not apply the start-of-session unmute — ' +
                         'run __vtTTS.findSound() and send me the output.');
          }
        }
      }, 300);

      // bot messages, and notice user sends. The webchat lives in a shadow root
      // that re-renders, so polling is more dependable than events here.
      setInterval(function () { ttsScanDom(); ttsWatchSound(); ttsMaybeEndSession(); }, 250);
      // Don't keep talking after the user navigates away.
      window.addEventListener('pagehide', function () { ttsStop(); });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) ttsStop();
      });
    }

    function ttsArmSoon() {
      if (_ttsArmed) return;
      setTimeout(function () {
        _ttsArmed = true;
        console.log('[VideoTrack][TTS] armed — new bot messages will be spoken when ON');
      }, TTS_ARM_DELAY_MS);
    }

    // Console helpers for local testing:
    //   __vtTTS.voices()   → every voice the device exposes
    //   __vtTTS.voice()    → the one we picked, and whether it's真 Cantonese
    //   __vtTTS.say('你好') → speak arbitrary text
    //   __vtTTS.clean('__userid:1__ 你好') → see what the sanitizer would speak
    window.__vtTTS = {
      voices: function () {
        try { return (_synth.getVoices() || []).map(function (v) { return v.name + '  [' + v.lang + ']'; }); }
        catch (e) { return []; }
      },
      voice:  function () { return { voice: _ttsVoice, cantonese: _ttsVoiceIsCanto }; },
      // Force on/off for testing. Note the 250ms poll re-syncs to Botpress's
      // speaker button, so these are momentary unless you also flip that.
      on:     function () { _ttsOn = true;  _ttsArmed = true; ttsPrime(); },
      off:    function () { _ttsOn = false; ttsStop(); },
      say:    function (t) { _ttsOn = true; ttsPrime(); ttsSpeak(String(t || '')); },
      clean:  ttsSanitize,
      stop:   ttsStop,
      // Push text through the EXACT path a real bot message takes (dedupe →
      // armed → toggle → sanitise → media check → speak), so the skip reason
      // printed here is the same one a live message would hit.
      simulate: function (t) {
        ttsOnBotMessage({ id: 'sim-' + Date.now() }, String(t || '你好，我係Kinny'));
      },
      // What the DOM watcher currently sees. rows = bot message rows found,
      // pending = rows still settling, spoken = rows already decided.
      rows: function () {
        var rows = ttsMessageRows(), out = [];
        for (var i = 0; i < rows.length; i++) {
          var st = _ttsRowState.get(rows[i]);
          out.push({ text: ttsRowText(rows[i]).slice(0, 50), decided: !!(st && st.done) });
        }
        return out;
      },
      scan: ttsScanDom,
      // Which element is actually being scrolled, and where the row sits in it.
      // If `scroller` is null or `rowOffsetFromTop` is huge, the jump is landing
      // on the wrong container.
      scrollDebug: function () {
        var rows = ttsMessageRows();
        var row  = rows.length ? rows[rows.length - 1] : null;
        var sc   = row ? ttsScrollElFor(row) : null;
        var out  = { row: row, scroller: sc, activeScroller: _scEl, gap: _scGap || null };
        if (row && sc) {
          var rr = row.getBoundingClientRect(), sr = sc.getBoundingClientRect();

      // Lists every clickable in the webchat header so the sound button can be

        var els = sr.querySelectorAll('button, [role="button"], svg[aria-label]'), out = [];

            cls: String(e.className && e.className.baseVal !== undefined ? e.className.baseVal : e.className || ''),
            aria: e.getAttribute('aria-label') || '',

      state:  function () {
        return { supported: _ttsSupported, on: _ttsOn, armed: _ttsArmed, primed: _ttsPrimed,
                 everSpoke: _ttsSpoke, platform: (IS_IOS ? 'iOS' : IS_ANDROID ? 'Android' : 'desktop'),

    // Anything else for HEAL_AFTER_MS of CONTINUOUS unhealthiness means stuck.
    //
    // ⚠️ This used to latch: the first healthy tick set `_healSettled = true`
    // and the check never ran again. That made it useless for the failure emon
    // actually hit — the page comes up fine, THEN Botpress swaps its shadow
    // root and renders nothing but its loading dots. By then the latch was set,
    // so nothing healed and no popup ever appeared: stuck forever with the
    // spinner and the 開始 button. The clock now runs from the last healthy
    // moment, so a page that breaks LATER is still caught.
    //
    // Re-arming brings back the loop risk the latch was there to prevent, so
    // the reloads are capped instead — at most HEAL_MAX_TRIES per browser tab,
    // ever, never cleared by a healthy tick. After that we stop guessing and
    // tell the user plainly.
    var HEAL_AFTER_MS  = 20000;
    var HEAL_MAX_TRIES = 2;
    var _pageLoadAt    = Date.now();
    var _healthyAt     = 0;      // last tick the webchat looked alive
    var _healPopupShown = false;

    // Read the per-tab heal counter, optionally incrementing it. Storage we
    // cannot read or write back is reported as "out of tries" — an auto-reload
    // we cannot count is a reload loop, which is worse than showing a button.
    function healTries(add) {
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem('vt_heal_count') || '0', 10) || 0;
        if (add) {
          sessionStorage.setItem('vt_heal_count', String(n + add));
          if (sessionStorage.getItem('vt_heal_count') !== String(n + add)) return HEAL_MAX_TRIES;
        }
      } catch (e) { return HEAL_MAX_TRIES; }
      return n;
    }

    function healthCheck() {
      // NOTE: deliberately NO `if (!sr) return`. bpShadowRoot() only resolves
      // once .bpComposerInput exists, so when the webchat fails to mount there
      // is no shadow root at all — an early return here made the recovery
      // depend on the very thing that was broken, and it never ran.
      var sr = bpShadowRoot();
      var healthy = false;
      if (sr) {
        healthy = sr.querySelectorAll('.bpMessageContainer').length > 0 ||
                  !!sr.querySelector('[class*="bpMessageListMarquee"]');
      }
      if (healthy) { _healthyAt = Date.now(); return; }
      if (popupOpen()) return;              // already asking the user something
      // Measure from the last healthy moment, or from page load if it has
      // never been healthy at all.
      if (Date.now() - (_healthyAt || _pageLoadAt) < HEAL_AFTER_MS) return;
      _healthyAt = Date.now();              // act once per stuck episode
      if (healTries(0) < HEAL_MAX_TRIES) {
        var n = healTries(1) + 1;
        console.warn('[VideoTrack] Webchat showed nothing for ' + (HEAL_AFTER_MS / 1000) +
                     's — clearing storage and reloading (attempt ' + n + '/' + HEAL_MAX_TRIES + ')');
        restartConversation();
      } else if (!_healPopupShown) {
        _healPopupShown = true;
        console.error('[VideoTrack] Still stuck after ' + HEAL_MAX_TRIES + ' heal attempts — asking the user');
        showChoicePopup({
          tag: 'load-failed',
          emoji: '📶',
          title: '載入不到對話',
          primaryIcon: '🔄', primary: '再試一次',
          onPrimary: function () { location.reload(); },
          secondaryIcon: '🆕', secondary: '重新開始',
          note: '可能是網絡不穩定，請先檢查連線。'
        });
      }
    }

    // ── Bad-account loop safety net ──────────────────────────
    // Studio's `ID Not Match` node loops straight back to `greeting`, and
    // because user.conversation_userid is still filled the capture there does
    // not wait for new input — so a wrong account produces
    // 帳號錯誤 → 你好！… → 帳號錯誤 → … forever, until the node-repetition limit
    // trips. Nothing on this page can stop a server-side loop, but we can stop
    // the participant from watching it scroll. The real fix is in Studio:
    // clear the variable in `ID Not Match` before transitioning back.
    var BAD_ID_LIMIT = 3;
    var _badIdShown  = false;
    function badAccountCheck() {
      if (_badIdShown || popupOpen()) return;
      var sr = bpShadowRoot(); if (!sr) return;
      var rows = sr.querySelectorAll('.bpMessageContainer[data-direction="incoming"]');
      var hits = 0;
      for (var i = 0; i < rows.length; i++) {
        if (/帳號錯誤/.test(rows[i].textContent || '')) hits++;
      }
      if (hits < BAD_ID_LIMIT) return;
      _badIdShown = true;
      console.warn('[VideoTrack] 帳號錯誤 seen ' + hits + 'x — bad-account loop, offering a way out');
      showChoicePopup({
        tag: 'bad-account',
        emoji: '⚠️',
        title: '帳號不正確',
        primaryIcon: '🔄', primary: '再輸入一次',
        onPrimary: function () { restartConversation(); },
        secondaryIcon: '✖️', secondary: '暫時不用',
        onSecondary: function () { hideIdlePopup(); },
        note: '請向研究員確認你的帳號。'
      });
    }

    function idleTick() {
      wireRestartGuard();
      watchdogTick();
      healthCheck();
      badAccountCheck();
      try { backToLatestTick(); } catch (e) {}
      if (!bpShadowRoot()) { idleNudge(); return; }
      if (!hasRealMessages()) { idleNudge(); return; }   // welcome screen — nothing to be idle in
      var sig = idleSignature();
      if (sig !== _idleSig) { _idleSig = sig; idleNudge(); return; }   // a message arrived or was sent
      if (idleMediaBusy() || idleTtsBusy()) { idleNudge(); return; }   // watching / listening counts
      if (popupOpen()) return;
      if (Date.now() - _idleAt >= IDLE_POPUP_MS) {
        console.log('[VideoTrack] Idle for ' + Math.round((Date.now() - _idleAt) / 1000) + 's — showing popup');
        showIdlePopup();
      }
    }
    setInterval(idleTick, 1000);

    // ── Never talk by itself after a lock / background ───────
    // Locking the phone and unlocking it made Kinny read the whole transcript
    // aloud. Two things cause it, and both are handled by disarming:
    //   1. messages that arrived while the screen was off would burst out on
    //      return, and
    //   2. the webchat re-renders on resume, so EVERY message row is a brand
    //      new DOM node — with nothing in _ttsRowState they all look like new
    //      messages, and read-aloud starts from the top.
    // Disarmed means rows are still marked as seen, just never spoken. We
    // re-arm a moment after the page is visible again, exactly like boot.
    var _ttsArmTimer = null;
    var _lastHiddenAt = 0;   // when the page was last backgrounded
    function ttsDisarm(why) {
      if (_ttsArmTimer) { clearTimeout(_ttsArmTimer); _ttsArmTimer = null; }
      _ttsQuietLogged = false;
      _ttsArmed = false;
      try { ttsStop(); } catch (e) {}
      console.log('[VideoTrack][TTS] disarmed —', why);
    }
    function ttsRearm(delay) {
      if (_ttsArmTimer) clearTimeout(_ttsArmTimer);
      _ttsArmTimer = setTimeout(function () {
        _ttsArmTimer = null;
        _ttsArmed = true;
        _ttsQuietLogged = false;
        console.log('[VideoTrack][TTS] re-armed after restore');
      }, delay || 2000);
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        _lastHiddenAt = Date.now();
        ttsDisarm('page hidden');
      } else {
        // Coming back is not "activity" for the idle popup, but a tab hidden
        // for hours must not fire it the instant it returns.
        idleNudge();
        ttsRearm(2000);
      }
    });
    // bfcache restore and mobile tab-freeze both land here rather than on
    // visibilitychange in some browsers.
    window.addEventListener('pageshow', function (e) { if (e.persisted) { ttsDisarm('bfcache restore'); ttsRearm(2000); } });
    window.addEventListener('freeze', function () { ttsDisarm('frozen'); });
    window.addEventListener('resume', function () { ttsRearm(2000); });

    // ── Debug mode: show status bar when ?debug in URL ───────
    if (new URLSearchParams(window.location.search).has('debug')) {
      document.getElementById('vt-status-bar').style.display = 'flex';
      // Manual triggers for testing the pain-scale widget without the bot:
      //   __vtPainScale.show(0,10)  /  __vtPainScale.hide()
      window.__vtPainScale = { show: showPainScale, hide: hidePainScale };
      // Test the landscape video overlay: __vtVideoLandscape.open(videoEl) / .close()
      window.__vtVideoLandscape = { open: openVideoLandscape, close: closeVideoLandscape, isIOS: IS_IOS };
      // Test choice widgets:
      //   __vtChoice.show('singlechoice',['A','B','C'])
      //   __vtChoice.show('multiplechoice',['上午','下午','晚上'])
      window.__vtChoice = { show: showChoice, hide: hidePainScale };
      // Test the composer lock: __vtComposer.unlock() / __vtComposer.lock()
      window.__vtComposer = { lock: function(){ setComposerEnabled(false); },
                              unlock: function(){ setComposerEnabled(true); } };
      // Test the idle popup: __vtIdle.show() / .hide()  (?idle=<minutes> to shorten)
      window.__vtIdle = { show: showIdlePopup, confirm: showRestartConfirmPopup,
                          hide: hideIdlePopup, minutes: IDLE_POPUP_MIN,
                          restart: restartConversation,
                          hint: showScrollHint, hideHint: hideScrollHint,
                          // why the idle timer is or isn't counting right now
                          why: function () {
                            return { mediaBusy: idleMediaBusy(), ttsBusy: idleTtsBusy(),
                                     popupOpen: popupOpen(), hidden: document.hidden,
                                     idleSeconds: Math.round((Date.now() - _idleAt) / 1000),
                                     firesAtSeconds: Math.round(IDLE_POPUP_MS / 1000) };
                          },
                          // list what the guard would match, to verify the selector
                          controls: function () {
                            var sr = bpShadowRoot(); if (!sr) return [];
                            return [].slice.call(sr.querySelectorAll('[aria-label],[title]'))
                              .map(function (n) { return (n.getAttribute('aria-label') || n.getAttribute('title')); });
                          } };
      // Why is (or isn't) the self-heal firing?  __vtHeal.why()
      window.__vtHeal = {
        why: function () {
          var sr = bpShadowRoot();
          return { hasShadowRoot: !!sr,
                   msgRows: sr ? sr.querySelectorAll('.bpMessageContainer').length : 0,
                   marquee: sr ? !!sr.querySelector('[class*="bpMessageListMarquee"]') : false,
                   unhealthySeconds: Math.round((Date.now() - (_healthyAt || _pageLoadAt)) / 1000),
                   firesAtSeconds: HEAL_AFTER_MS / 1000,
                   triesUsed: healTries(0), maxTries: HEAL_MAX_TRIES };
        },
        now: healthCheck
      };
      // Test the session menu: __vtMenu.show('current=3;finished=2')
      window.__vtMenu = { show: function(spec){ showSessionMenu(parseSessionMenu(spec), spec.replace(/\s+/g,'')); },
                          hide: hidePainScale };
      // Diagnostic: why is the composer locked right now?
      window.__vtWhy = function(){ return {
        convStarted:_convStarted, postSendLock:_postSendLock, idle:botIsIdle(),
        painScale:!!_painScaleEl, allowsTyping:latestBotStepAllowsTyping(),
        enabled:_composerEnabled, sinceLastMsg:(Date.now()-_lastMsgChangeAt), sig:_msgSig
      }; };
    }

    setStatus('', 'Script loaded — waiting for page...');

  })();
  </script>

</body>
